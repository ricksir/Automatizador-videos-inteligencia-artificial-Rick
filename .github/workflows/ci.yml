name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Lint Python sources
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check app cli.py main.py webui test docs/skill

      - name: Run unit tests with coverage
        # pytest 兼容现有 unittest.TestCase，同时会收集仓库中的 pytest 风格
        # 测试，避免测试文件已存在但 CI 没有真正执行。
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      # Keep the legacy suite's portable media backend selection unchanged.
      # Native project rendering is a separate mandatory pass after installing
      # system tools; append its coverage before enforcing the shared threshold.
      - name: Install FFmpeg for native revision-rendering tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run native revision-rendering tests
        run: >-
          uv run --no-sync python -X utf8 -m coverage run --append -m pytest -q
          test/services/test_video_project.py test/services/test_minimax_output_container.py

      - name: Report test coverage
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
          test/services/test_webui_task.py
          test/services/test_webui_headless_task_actions.py
          test/services/test_cache_manager.py
          test/services/test_material_cache.py

  rick-native:
    name: Rick native two-scene MP4 export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RICK_RUN_NATIVE_RENDER_TEST: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen --python 3.11

      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render and inspect two synthetic Rick scenes
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_rick_review_render_native.py

  rick-editorial:
    name: Rick editorial review (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen --python 3.11

      - name: Run directed Rick editorial tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_rick_visual_curation.py
          test/services/test_rick_editorial_panel_ui.py
          test/services/test_rick_editorial_workspace.py
          test/services/test_rick_editorial_assets.py
          test/services/test_rick_editorial_review.py
          test/services/test_rick_scene_assignment.py
          test/services/test_rick_review_render.py
          test/services/test_rick_scene_timeline.py
          test/services/test_rick_auto_commons.py

      - name: Diagnose Wikimedia Commons search (non-blocking, no downloads)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: >-
          uv run --no-sync python -X utf8 -c
          "from app.services.rick_auto_commons import find_commons_stills, download_commons_still, _commons_pages;
          pages, tokens = _commons_pages({'action':'query', 'titles':'File:Gramsci.png', 'prop':'imageinfo', 'iiprop':'url|size|mime|extmetadata', 'iiurlwidth':'900', 'format':'json', 'formatversion':'2'});
          print('Exact file pages:', len(pages), 'tokens', tokens);
          [print('FILE', p.get('title'), p.get('ns'), p.get('missing'), [(i.get('mime'), i.get('thumburl'), i.get('descriptionurl'), {k:v.get('value') for k,v in i.get('extmetadata',{}).items() if k in ('LicenseShortName','LicenseUrl','Copyrighted','NonFree','Restrictions')}) for i in p.get('imageinfo',[])]) for p in pages];
          photos = find_commons_stills('Gramsci', max_results=5);
          print('Commons images accepted:', len(photos));
          [print(p['title'], p['license'], p['source_page']) for p in photos];
          material = download_commons_still(photos[0]) if photos else None;
          print('Verified image download:', material[0], len(material[1])) if material else print('No downloadable image')"
