name: Rick security guard
on:
  pull_request:
  push:
    branches:
      - main

# No write access, no secrets, no artifact uploads.
permissions:
  contents: read

jobs:
  offline-security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check tracked files without printing contents
        run: python3 scripts/rick_security_guard.py
